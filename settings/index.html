<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="settings.title">Rejoin History</title>
  <script src="/homey.js" data-origin="settings"></script>
  <style>
    :root {
      --ink: #102a43;
      --muted: #627d98;
      --paper: #f4f8fb;
      --panel: #fff;
      --line: #d9e5ef;
      --blue: #5078c4;
      --blue-dark: #315aab;
      --pulse: #6e91d5;
      --good: #16856a;
      --bad: #c45151;
      --shadow: 0 12px 32px rgba(16, 42, 67, 0.08);
    }

    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    body {
      margin: 0;
      padding: 24px;
      color: var(--ink);
      background:
        linear-gradient(90deg, rgba(80, 120, 196, 0.035) 1px, transparent 1px),
        var(--paper);
      background-size: 24px 24px;
      font-family: "Avenir Next", "Segoe UI", sans-serif;
      line-height: 1.45;
    }

    button, select { font: inherit; }
    .shell { width: min(1080px, 100%); margin: 0 auto; }
    .masthead {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 24px;
      align-items: end;
      margin-bottom: 20px;
    }
    .eyebrow {
      margin: 0 0 6px;
      color: var(--blue-dark);
      font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: clamp(28px, 5vw, 46px);
      font-weight: 650;
      letter-spacing: -0.045em;
      line-height: 1;
    }
    .intro { max-width: 650px; margin: 10px 0 0; color: var(--muted); font-size: 14px; }
    .refresh {
      min-height: 42px;
      padding: 0 16px;
      border: 1px solid var(--blue);
      border-radius: 8px;
      color: #fff;
      background: var(--blue);
      font-weight: 650;
      cursor: pointer;
    }
    .header-actions { display: flex; gap: 8px; }
    .reset {
      min-height: 42px;
      padding: 0 16px;
      border: 1px solid var(--bad);
      border-radius: 8px;
      color: var(--bad);
      background: transparent;
      font-weight: 650;
      cursor: pointer;
      white-space: nowrap;
    }
    .reset:hover { color: #fff; background: var(--bad); }
    .refresh:hover { background: var(--blue-dark); }
    .refresh[disabled], .reset[disabled] { cursor: wait; opacity: 0.65; }
    .refresh:focus-visible, .reset:focus-visible, select:focus-visible, th button:focus-visible, .tab:focus-visible {
      outline: 3px solid rgba(80, 120, 196, 0.28);
      outline-offset: 2px;
    }

    .tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--line);
    }
    .tab {
      padding: 10px 4px;
      margin-bottom: -1px;
      border: 0;
      border-bottom: 2px solid transparent;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      font-weight: 650;
      cursor: pointer;
    }
    .tab + .tab { margin-left: 16px; }
    .tab.active { color: var(--blue-dark); border-bottom-color: var(--blue); }
    .panel[hidden] { display: none; }

    .summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      overflow: hidden;
      margin-bottom: 16px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }
    .summary.summary-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .summary-item { min-width: 0; padding: 16px 18px; border-right: 1px solid var(--line); }
    .summary-item:last-child { border-right: 0; }
    .summary-label {
      display: block;
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .summary-value {
      display: block;
      overflow: hidden;
      font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
      font-size: 22px;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .toolbar {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .toolbar-note, .sort-wrap { color: var(--muted); font-size: 12px; }
    .toolbar-actions { display: flex; gap: 12px; align-items: center; }
    .sort-wrap { display: flex; gap: 8px; align-items: center; }
    select {
      min-height: 36px;
      padding: 0 34px 0 10px;
      border: 1px solid var(--line);
      border-radius: 7px;
      color: var(--ink);
      background: var(--panel);
    }

    .table-shell {
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th {
      padding: 0;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      background: #f9fbfd;
      text-align: right;
      white-space: nowrap;
    }
    th:first-child { text-align: left; }
    th button {
      width: 100%;
      padding: 12px 14px;
      border: 0;
      color: inherit;
      background: transparent;
      font-size: 10px;
      font-weight: 750;
      letter-spacing: 0.065em;
      text-align: inherit;
      text-transform: uppercase;
      cursor: pointer;
    }
    th.plain { padding: 12px 14px; font-size: 10px; font-weight: 750; letter-spacing: 0.065em; text-transform: uppercase; }
    td {
      padding: 14px;
      border-bottom: 1px solid #edf3f7;
      text-align: right;
      vertical-align: middle;
      white-space: nowrap;
    }
    tr:last-child td { border-bottom: 0; }
    td:first-child { width: 42%; min-width: 250px; text-align: left; white-space: normal; }
    .device-name { display: flex; gap: 8px; align-items: center; margin-bottom: 3px; font-weight: 700; }
    .status-dot {
      width: 8px;
      height: 8px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: var(--good);
      box-shadow: 0 0 0 3px rgba(22, 133, 106, 0.12);
    }
    .status-dot.offline { background: var(--bad); box-shadow: 0 0 0 3px rgba(196, 81, 81, 0.12); }
    .device-meta {
      color: var(--muted);
      font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
      font-size: 10px;
    }
    .number {
      font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
      font-variant-numeric: tabular-nums;
      font-weight: 650;
    }
    .pulse-track {
      width: 100%;
      height: 3px;
      overflow: hidden;
      margin-top: 8px;
      border-radius: 3px;
      background: #e6f0f4;
    }
    .pulse-bar { height: 100%; border-radius: inherit; background: var(--pulse); }
    .mode {
      display: inline-block;
      margin-left: 6px;
      padding: 1px 5px;
      border: 1px solid var(--line);
      border-radius: 4px;
      color: var(--muted);
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .rejoin-count-badge {
      display: inline-block;
      min-width: 22px;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(196, 81, 81, 0.12);
      color: var(--bad);
      font-weight: 700;
    }
    .state { padding: 40px 18px; color: var(--muted); text-align: center; }
    .footnote { margin: 12px 2px 0; color: var(--muted); font-size: 11px; }

    @media (max-width: 720px) {
      body { padding: 14px 10px; font-size: 13px; line-height: 1.4; }
      .masthead { grid-template-columns: 1fr; gap: 12px; margin-bottom: 14px; }
      .eyebrow { margin-bottom: 4px; font-size: 9px; }
      h1 { font-size: 24px; letter-spacing: -0.035em; }
      .intro { margin-top: 8px; font-size: 12px; }
      .header-actions { display: grid; grid-template-columns: 1fr; }
      .refresh, .reset { min-height: 36px; padding: 0 10px; font-size: 13px; }
      .tabs { margin-bottom: 12px; }
      .tab { font-size: 12px; padding: 8px 2px; }
      .summary, .summary.summary-3 { grid-template-columns: 1fr; margin-bottom: 12px; }
      .summary-item { padding: 11px 14px; border-right: 0; border-bottom: 1px solid var(--line); }
      .summary-item:last-child { border-bottom: 0; }
      .summary-label { margin-bottom: 3px; font-size: 9px; }
      .summary-value { font-size: 18px; }
      .summary-item:last-child .summary-value {
        font-size: 15px;
        line-height: 1.3;
        text-overflow: clip;
        white-space: normal;
      }
      .toolbar { gap: 8px; align-items: stretch; flex-direction: column; margin-bottom: 8px; }
      .toolbar-actions { flex-direction: column; align-items: stretch; }
      .toolbar-note, .sort-wrap { font-size: 10px; }
      .sort-wrap { justify-content: space-between; }
      select { flex: 1; min-height: 32px; font-size: 11px; }
      table { font-size: 11px; }
      th button, th.plain { padding: 9px 10px; font-size: 8px; }
      td { padding: 10px; }
      td:first-child { min-width: 205px; }
      .device-name { gap: 7px; font-size: 11px; line-height: 1.3; }
      .device-meta, .mode { font-size: 8px; }
      .footnote { margin-top: 10px; font-size: 9px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="masthead">
      <div>
        <p class="eyebrow" data-i18n="settings.eyebrow">Moes</p>
        <h1 data-i18n="settings.title">Rejoin History</h1>
        <p class="intro" data-i18n="settings.intro">Tracks when a device reconnects to the Zigbee network after a power cut.</p>
      </div>
      <div class="header-actions">
        <button id="refresh" class="refresh" type="button" data-i18n="settings.refresh">Refresh now</button>
      </div>
    </header>

    <div id="panel-rejoins" class="panel" role="tabpanel">
      <section class="summary summary-3" aria-label="Rejoin summary">
        <div class="summary-item">
          <span class="summary-label" data-i18n="settings.total_rejoins">Total rejoins</span>
          <strong id="rejoin-total" class="summary-value">—</strong>
        </div>
        <div class="summary-item">
          <span class="summary-label" data-i18n="settings.devices_with_rejoins">Devices affected</span>
          <strong id="rejoin-device-count" class="summary-value">—</strong>
        </div>
        <div class="summary-item">
          <span class="summary-label" data-i18n="settings.rejoins_since">Rejoins tracked since</span>
          <strong id="rejoin-since" class="summary-value">—</strong>
        </div>
      </section>

      <div class="toolbar">
        <span id="updated-at" class="toolbar-note" data-i18n="settings.waiting_for_data">Waiting for data…</span>
        <div class="toolbar-actions">
          <button id="reset-rejoins" class="reset" type="button" data-i18n="settings.reset_rejoins">Reset rejoins</button>
        </div>
      </div>

      <section class="table-shell" aria-live="polite">
        <table>
          <thead>
            <tr>
              <th class="plain" style="text-align:left" data-i18n="settings.device">Device</th>
              <th class="plain" data-i18n="settings.rejoins">Rejoins</th>
              <th class="plain" data-i18n="settings.last_rejoin">Last rejoin</th>
            </tr>
          </thead>
          <tbody id="rejoin-rows">
            <tr><td colspan="3" class="state" data-i18n="settings.loading">Loading statistics…</td></tr>
          </tbody>
        </table>
      </section>
    </div>
  </main>

  <script>
    var homeyApi = null;
    var devices = [];
    var rejoinSince = null;
    var latestRequest = 0;
    var resetInFlight = false;

    function translate(key) {
      if (homeyApi && typeof homeyApi.__ === 'function') return homeyApi.__(key);
      return key;
    }

    function userLocale() {
      return navigator.language || 'en';
    }

    function escapeHtml(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function formatNumber(value) {
      return new Intl.NumberFormat(userLocale()).format(Number(value) || 0);
    }

    function formatTime(timestamp) {
      if (!timestamp) return '—';
      return new Intl.DateTimeFormat(userLocale(), {
        day: '2-digit',
        month: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        hour12: false
      }).format(new Date(timestamp));
    }

    function formatDate(timestamp) {
      if (!timestamp) return '—';
      return new Intl.DateTimeFormat(userLocale(), {
        day: '2-digit',
        month: '2-digit',
        year: 'numeric'
      }).format(new Date(timestamp));
    }

    function renderRejoins() {
      var affected = devices
        .filter(function(device) { return device.rejoinCount; })
        .sort(function(a, b) { return (b.rejoinCount || 0) - (a.rejoinCount || 0); });

      var rows = document.getElementById('rejoin-rows');
      if (affected.length === 0) {
        rows.innerHTML = '<tr><td colspan="3" class="state">' + escapeHtml(translate('settings.no_rejoins')) + '</td></tr>';
      } else {
        rows.innerHTML = affected.map(function(device) {
          return '<tr>' +
            '<td>' +
              '<div class="device-name">' +
                '<span>' + escapeHtml(device.name) + '</span>' +
              '</div>' +
            '</td>' +
            '<td class="number"><span class="rejoin-count-badge">' + formatNumber(device.rejoinCount) + '</span></td>' +
            '<td class="number">' + escapeHtml(formatTime(device.rejoinLastAt)) + '</td>' +
          '</tr>';
        }).join('');
      }

      var totalRejoins = affected.reduce(function(sum, device) { return sum + (device.rejoinCount || 0); }, 0);
      document.getElementById('rejoin-total').textContent = formatNumber(totalRejoins);
      document.getElementById('rejoin-device-count').textContent = formatNumber(affected.length);
      document.getElementById('rejoin-since').textContent = formatDate(rejoinSince);
    }

    function loadStats() {
      if (!homeyApi || resetInFlight) return;
      var requestId = ++latestRequest;
      var refreshButton = document.getElementById('refresh');
      var resetRejoinsButton = document.getElementById('reset-rejoins');
      refreshButton.disabled = true;
      resetRejoinsButton.disabled = true;
      refreshButton.textContent = translate('settings.refreshing');

      homeyApi.api('GET', '/rejoin-stats?t=' + Date.now(), {}, function(error, result) {
        if (requestId !== latestRequest) return;
        refreshButton.disabled = false;
        resetRejoinsButton.disabled = false;
        refreshButton.textContent = translate('settings.refresh');
        if (error) {
          document.getElementById('rejoin-rows').innerHTML =
            '<tr><td colspan="3" class="state">' + escapeHtml(translate('settings.failed_load')) + ' ' +
            escapeHtml(error.message || error) + '</td></tr>';
          return;
        }
        devices = (result && Array.isArray(result.devices)) ? result.devices : [];
        rejoinSince = result ? result.since : null;
        document.getElementById('updated-at').textContent =
          translate('settings.updated_at') + ' ' + new Intl.DateTimeFormat(userLocale(), {
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit',
            hour12: false
          }).format(new Date());
        renderRejoins();
      });
    }

    function performResetRejoins() {
      latestRequest += 1;
      var refreshButton = document.getElementById('refresh');
      var resetRejoinsButton = document.getElementById('reset-rejoins');
      refreshButton.disabled = true;
      resetRejoinsButton.disabled = true;
      resetRejoinsButton.textContent = translate('settings.resetting_rejoins');

      homeyApi.api('POST', '/rejoin-stats/reset', {}, function(error) {
        resetInFlight = false;
        refreshButton.disabled = false;
        resetRejoinsButton.disabled = false;
        resetRejoinsButton.textContent = translate('settings.reset_rejoins');

        if (error) {
          document.getElementById('updated-at').textContent =
            translate('settings.reset_rejoins_failed') + ' ' + (error.message || error);
          return;
        }

        loadStats();
      });
    }

    function resetRejoinsStats() {
      if (!homeyApi || resetInFlight) return;

      var message = translate('settings.reset_rejoins_confirmation');
      var resetRejoinsButton = document.getElementById('reset-rejoins');
      resetInFlight = true;
      resetRejoinsButton.disabled = true;

      function handleConfirmation(error, confirmed) {
        if (error || !confirmed) {
          resetInFlight = false;
          resetRejoinsButton.disabled = false;
          if (error) {
            document.getElementById('updated-at').textContent =
              translate('settings.confirmation_failed') + ' ' + (error.message || error);
          }
          return;
        }

        performResetRejoins();
      }

      if (typeof homeyApi.confirm === 'function') {
        homeyApi.confirm(message, 'warning', handleConfirmation);
      } else {
        handleConfirmation(null, window.confirm(message));
      }
    }

    document.getElementById('refresh').addEventListener('click', loadStats);
    document.getElementById('reset-rejoins').addEventListener('click', resetRejoinsStats);

    function onHomeyReady(Homey) {
      homeyApi = Homey;
      Homey.ready();
      loadStats();
      setInterval(loadStats, 60 * 1000);
    }
  </script>
</body>
</html>
